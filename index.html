<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Meghna 💖</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    overflow: hidden;
}

/* Center container */
.container {
    position: absolute;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    padding: 20px;
}

/* Glass card */
.card {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 30px;
    width: 90%;
    max-width: 350px;
    margin: auto;
    box-shadow: 0 0 30px rgba(255,255,255,0.1);
    transition: 0.5s;
}

/* Hide sections */
.section {
    display: none;
    animation: fade 0.6s ease;
}

.active {
    display: block;
}

@keyframes fade {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

/* Buttons */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: white;
    color: #ff4b2b;
    font-weight: bold;
    cursor: pointer;
}

/* Icons */
.icon {
    font-size: 70px;
    cursor: pointer;
    transition: 0.3s;
}

.icon:hover {
    transform: scale(1.2);
}

/* Letter */
#letterText {
    margin-top: 15px;
    font-size: 16px;
    line-height: 1.6;
}

/* Input */
input {
    padding: 10px;
    border-radius: 10px;
    border: none;
    width: 80%;
    text-align: center;
}

/* Slideshow */
#slide {
    width: 100%;
    border-radius: 15px;
    margin-top: 15px;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: 0;
    animation: float 6s linear infinite;
}

@keyframes float {
    to { transform: translateY(-110vh); }
}

</style>

</head>

<body>

<div class="container">

<!-- 🎁 Gift -->
<div id="gift" class="section active">
    <div class="card">
        <h2>Your Surprise 🎁</h2>
        <div class="icon" onclick="next('gift','envelope')">🎁</div>
    </div>
</div>

<!-- 💌 Envelope -->
<div id="envelope" class="section">
    <div class="card">
        <h2>Open Me 💌</h2>
        <div class="icon" onclick="openLetter()">💌</div>
    </div>
</div>

<!-- 💖 Letter -->
<div id="letter" class="section">
    <div class="card">
        <h2>Dear Meghna 💖</h2>
        <p id="letterText"></p>
        <button onclick="next('letter','question')">Continue ➡️</button>
    </div>
</div>

<!-- ❓ Question -->
<div id="question" class="section">
    <div class="card">
        <h3>What name do I call you most often? 😏</h3>
        <input id="answer">
        <br>
        <button onclick="check()">Submit</button>
        <p id="result"></p>
    </div>
</div>

<!-- 📸 Slideshow -->
<div id="slideshow" class="section">
    <div class="card">
        <h2>Our Memories 💖</h2>
        <img id="slide" src="photo1.jpg">
    </div>
</div>

</div>

<audio id="music" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

<script>

/* Navigation */
function next(current, next) {
    document.getElementById(current).classList.remove("active");
    setTimeout(()=>{
        document.getElementById(next).classList.add("active");
    },300);
}

/* Typing */
const text = "Happy Birthday Meghna 💖 You are truly special in my life... I hope your life is filled with happiness, success, and beautiful moments 😊✨";
let i = 0;

function openLetter() {
    next('envelope','letter');
    document.getElementById("music").play();
    type();
}

function type() {
    if (i < text.length) {
        document.getElementById("letterText").innerHTML += text[i];
        i++;
        setTimeout(type, 35);
    }
}

/* Question */
function check() {
    let ans = document.getElementById("answer").value.toLowerCase();

    if (ans === "rowdy") {
        next('question','slideshow');
        startSlide();
        hearts();
    } else {
        document.getElementById("result").innerHTML = "Wrong 😜 Try again";
    }
}

/* Slideshow */
let imgs = ["photo1.jpg","photo2.jpg","photo3.jpg"];
let index = 0;

function startSlide() {
    setInterval(()=>{
        index = (index+1)%imgs.length;
        document.getElementById("slide").src = imgs[index];
    },2500);
}

/* Hearts */
function hearts() {
    for(let i=0;i<20;i++){
        let h=document.createElement("div");
        h.innerHTML="💖";
        h.className="heart";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(20+Math.random()*20)+"px";
        document.body.appendChild(h);
    }
}

</script>

</body>
</html>
